name: Feature request
description: A new hook or skill, or an improvement to an existing one
labels: [enhancement]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [guards, workflow, testing, repo-setup, creative, lint, New plugin, Whole marketplace]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens today, and what you would like to be able to do
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
