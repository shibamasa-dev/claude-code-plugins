name: Bug report
description: A hook or skill doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [guards, workflow, testing, repo-setup, creative, lint, Whole marketplace]
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Hook, skill or command name
      placeholder: bash-guard / issue-ops, etc.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what actually happened. If something was blocked, include the message
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands or prompts you ran. Redact personal paths and tokens
  - type: input
    id: versions
    attributes:
      label: Environment
      description: Plugin version, `claude --version`, OS
      placeholder: guards 0.1.3 / Claude Code 2.1.290 / macOS 26
    validations:
      required: true
