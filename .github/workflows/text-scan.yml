# Check issue / PR text (titles, bodies, comments, reviews) for private values. leak-scan.yml checks
# file contents; nothing checked this text before.
#
# Safety:
# - Only the default branch is checked out, never PR code. Review events run with GITHUB_REF = the PR
#   merge ref, so a checkout without `ref` would fetch PR code
# - The script reads the event from $GITHUB_EVENT_PATH and the thread from the API. No event field
#   appears inside a `run:` (an expression there would be pasted into the shell script)
# - The token can write labels only because pull_request_target and the issue events run in the base
#   repository's context even for outside authors. That is safe here: no PR code runs, the script comes
#   from the default branch, and the only write is a constant label name
# - Review events from a fork get no secret and a read-only token: the built-ins still run, the job says
#   BLOCKED_PATTERNS was unavailable, and the daily sweep scans that thread with all patterns
name: text-scan

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  schedule:
    - cron: "17 3 * * *" # daily sweep of the threads updated in the last 26 hours
  workflow_dispatch:
    inputs:
      all:
        description: Scan every issue and PR, not only the ones updated in the last 26 hours
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

# Two edits in a row must not race on the label
concurrency:
  group: text-scan-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan script (default branch = trusted code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Private values in issue / PR text
        env:
          BLOCKED_PATTERNS: ${{ secrets.BLOCKED_PATTERNS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Review events take this file from the PR merge ref, so it can run before the script is on the default branch
          if [ ! -f .github/scripts/leak/scan-text.py ]; then
            echo "::notice::scan-text.py is not on the default branch yet; nothing was scanned"
            exit 0
          fi
          python3 .github/scripts/leak/scan-text.py
