# Validate the plugins and run the hook tests on PRs and on pushes to main.
# No paths filter, so this can be a required check without getting stuck (a required check with a
# filter stays "Expected" forever on PRs it skips).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version check compares against the base
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: claude plugin validate --strict (marketplace and each plugin)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done
      # Internal names (secret BLOCKED_PATTERNS) are checked by leak-scan.yml so the check also covers PRs from forks
      - name: SKILL.md name vs directory, personal environment leaks, README pairs
        run: python3 .github/scripts/check-repo.py
      - name: Lines added by the PR are in English (no Japanese outside quotes)
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check-repo.py --base "origin/${{ github.base_ref }}"
      - name: Plugins whose contents changed also bump their version
        if: github.event_name == 'pull_request'
        run: .github/scripts/check-version-bump.sh "origin/${{ github.base_ref }}"

  tests:
    # The tests assume macOS date -v / touch -t (3 runbook tests fail on Linux)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hook regression sweep (fails on any mismatch)
        run: |
          git config --global user.name ci
          git config --global user.email ci@users.noreply.github.com
          fail=0
          for t in plugins/*/tests/run-all.sh; do
            echo "::group::$t"
            rc=0; out=$(bash "$t" 2>&1) || rc=$?   # print the output before judging, even on failure (don't die silently under -e)
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" != 0 ]; then echo "::error::$t exited with $rc"; fail=1; fi
            echo "$out" | grep -qE '/ 0 mismatches ====' || { echo "::error::$t reported mismatches"; fail=1; }
          done
          exit $fail
