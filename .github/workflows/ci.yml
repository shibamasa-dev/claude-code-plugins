# Validate the plugins and run the hook tests on PRs and on pushes to main.
# No paths filter, so this can be a required check without getting stuck (a required check with a
# filter stays "Expected" forever on PRs it skips).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version check compares against the base
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The CLI version lives in .github/claude-code-version (read by release.yml too)
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@$(cat .github/claude-code-version)"
      - name: claude plugin validate --strict (marketplace and each plugin)
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done
      - name: Mod tests (claude plugin test on each plugin that has *.test.ts)
        run: |
          claude plugin test plugins/instructions
          claude plugin test plugins/workflow
      # Internal names (secret BLOCKED_PATTERNS) are checked by leak-scan.yml so the check also covers PRs from forks
      - name: SKILL.md name vs directory, personal environment leaks, README pairs
        run: python3 .github/scripts/check-repo.py
      - name: Text scanner tests (scan-text.py against a fake API)
        run: python3 -m unittest discover -s .github/scripts/leak/tests
      - name: Lines added by the PR are in English (no Japanese outside quotes)
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check-repo.py --base "origin/${{ github.base_ref }}"
      - name: Plugins whose contents changed also bump their version
        if: github.event_name == 'pull_request'
        run: .github/scripts/check-version-bump.sh "origin/${{ github.base_ref }}"

  tests:
    # The tests assume macOS date -v / touch -t (3 runbook tests fail on Linux)
    # Hooks run under the user's python3, which is 3.9 on a stock macOS, so run the suites under that python3 as well
    name: tests (python ${{ matrix.python }})
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: [default, '3.9']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The stock macOS python3 (/usr/bin/python3, from Xcode or the Command Line Tools), not a setup-python build:
      # setup-python's 3.9.13 links SQLite 3.37.2, while the one users have links the system SQLite
      - name: Put the stock macOS python3 first on PATH
        if: matrix.python != 'default'
        run: |
          mkdir -p "$RUNNER_TEMP/stock-python"
          ln -s /usr/bin/python3 "$RUNNER_TEMP/stock-python/python3"
          echo "$RUNNER_TEMP/stock-python" >> "$GITHUB_PATH"
      - name: Show which python3 the tests use
        run: |
          command -v python3
          python3 --version
          python3 -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'  # inventory needs 3.38+ for ->>
          if [ "${{ matrix.python }}" != default ]; then
            python3 -c 'import sys; v = "%d.%d" % sys.version_info[:2]; sys.exit(0 if v == "${{ matrix.python }}" else "python3 is " + v)'
          fi
      # py_compile is not enough: a 3.10-only annotation (`str | None`) parses on 3.9 and fails only when the module runs
      - name: Execute every plugin hook and script at module level (without main)
        if: matrix.python != 'default'
        run: python3 .github/scripts/imports/import-check.py
      - name: Hook regression sweep (fails on any mismatch)
        run: |
          git config --global user.name ci
          git config --global user.email ci@users.noreply.github.com
          fail=0
          for t in plugins/*/tests/run-all.sh; do
            echo "::group::$t"
            rc=0; out=$(bash "$t" 2>&1) || rc=$?   # print the output before judging, even on failure (don't die silently under -e)
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" != 0 ]; then echo "::error::$t exited with $rc"; fail=1; fi
            echo "$out" | grep -qE '/ 0 mismatches ====' || { echo "::error::$t reported mismatches"; fail=1; }
          done
          exit $fail

  postgres:
    # The inventory tests against a real Postgres: run-postgres.sh as is (a postgres:16 container, the server under uv)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Tools the script needs
        run: |
          docker --version
          psql --version
          uv --version
      - name: Inventory tests on Postgres (fails on any mismatch)
        run: |
          rc=0; out=$(bash plugins/inventory/tests/run-postgres.sh 2>&1) || rc=$?
          echo "$out"
          fail=0
          if [ "$rc" != 0 ]; then echo "::error::run-postgres.sh exited with $rc"; fail=1; fi
          echo "$out" | grep -qE '/ 0 mismatches ====' || { echo "::error::run-postgres.sh reported mismatches"; fail=1; }
          # pg-file-only.sh runs only on the Postgres route, so its absence means the run fell back to SQLite or stopped early
          echo "$out" | grep -q '▼ pg-file-only.sh' || { echo "::error::pg-file-only.sh did not run"; fail=1; }
          exit $fail
      - name: agent-bridge schema tests on Postgres (fails on any mismatch)
        run: |
          rc=0; out=$(bash plugins/agent-bridge/tests/run-postgres.sh 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" != 0 ]; then echo "::error::agent-bridge run-postgres.sh exited with $rc"; exit 1; fi
          echo "$out" | grep -qE '/ 0 mismatches ====' || { echo "::error::agent-bridge run-postgres.sh reported mismatches"; exit 1; }
