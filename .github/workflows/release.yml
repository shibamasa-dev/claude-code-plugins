# Tag <plugin>--v<version> for each plugin whose version on main has no tag yet.
# The work is done by claude plugin tag --push (which also stops on a version mismatch between plugin.json and marketplace.json).
# Dependency semver ranges resolve against these tags (official plugins/dependencies docs).
# Tags can't be taken back, so only tag commits whose push to main passed ci (never run in parallel with ci).
# The leak-scan check is also re-run here before tagging.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
# No manual trigger (workflow_dispatch): it would allow tagging without checking the ci result.
# To tag by hand, run claude plugin tag --push locally (CONTRIBUTING.md).

permissions:
  contents: write # push tags

# No concurrency group. With a shared group only one run stays queued, so a version bumped in a commit
# in between would be skipped without a tag. Each run handles only its own commit's versions; races for the same tag are absorbed below.

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # the exact commit that passed ci
          fetch-depth: 0
          fetch-tags: true
      # ci does not see the secret BLOCKED_PATTERNS (leak-scan.yml checks it separately). workflow_run can't
      # wait on several workflows with AND, so run the same check here before tagging
      - name: Internal name leaks (same check as leak-scan)
        env:
          BLOCKED_PATTERNS: ${{ secrets.BLOCKED_PATTERNS }}
          HIDE_BLOCKED_LOCATIONS: "1"  # don't print match locations in the public log (see check-repo.py)
        run: python3 .github/scripts/check-repo.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tag new versions
        run: |
          npm install -g @anthropic-ai/claude-code
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in plugins/*/; do
            p=$(basename "$d")
            v=$(jq -r '.version // empty' "$d.claude-plugin/plugin.json")
            [ -n "$v" ] || continue
            if git rev-parse -q --verify "refs/tags/$p--v$v" >/dev/null; then
              echo "$p--v$v already exists"
              continue
            fi
            if ! claude plugin tag "$d" --push; then
              # Treat as success if a parallel run pushed the same tag first (check origin, not the local tag)
              git ls-remote --exit-code --tags origin "refs/tags/$p--v$v" >/dev/null || exit 1
              echo "$p--v$v was tagged by another run"
            fi
          done
